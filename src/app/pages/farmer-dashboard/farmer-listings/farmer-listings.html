<div class="a-page">
    <section class="section-header">
      <div class="section-header-subsection">
        <h1 class="grad-text">My Crop Listings</h1>
        <p>Review and manage your active crop market entries.</p>
      </div>
    </section>

    <div class="listings-grid" *ngIf="myListings().length > 0; else emptyState">
      <div class="listing-card" *ngFor="let crop of myListings()">
        <div class="card-header">
        <span class="crop-id">#{{crop.listingId}}</span>
        <span class="status-badge" [attr.data-status]="crop.status">{{crop.status}}</span>
      </div>
      <div class="card-body">
        <h3>{{crop.cropType}}</h3>
        <p><strong>Quantity:</strong> {{crop.quantity}} Quintal</p>
        <p><strong>Price:</strong> ₹{{crop.price}}</p>
        <p><strong>Location:</strong> {{crop.location}}</p>
      </div>
    </div>
  </div>

  <ng-template #emptyState>
    <div class="no-data">
      <p>You haven't listed any crops yet.</p>
    </div>
  </ng-template>
</div>
