<div class="p-8 bg-gray-50 min-h-screen">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="mb-10">
      <h1 class="text-3xl font-extrabold text-slate-900">Audit Management</h1>
      <p class="mt-2 text-slate-600 font-medium">Compliance & Agricultural Policy Oversight</p>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-10">
      <!-- Create Audit Section -->
      <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center">
          New Audit Entry
        </h2>
        <form (ngSubmit)="onSubmit()" #auditForm="ngForm" class="space-y-5">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Officer ID</label>
            <input type="number" [(ngModel)]="newAudit.officerId" name="officerId" required
              class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Audit Scope</label>
            <select [(ngModel)]="newAudit.scope" name="scope" 
              class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
              <option *ngFor="let s of scopes" [value]="s">{{s}}</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Findings Summary</label>
            <textarea [(ngModel)]="newAudit.findings" name="findings" rows="4" required
              class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition" 
              placeholder="Detail your observations here..."></textarea>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Date of Audit</label>
            <input type="date" [(ngModel)]="newAudit.date" name="date" 
              class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
          </div>

          <button type="submit" [disabled]="!auditForm.valid"
            class="w-full py-3 bg-indigo-600 text-white font-bold rounded-lg shadow-lg hover:bg-indigo-700 disabled:bg-slate-400 transition-all transform active:scale-95">
            Submit Audit
          </button>
        </form>
      </div>

      <!-- Audit History Table -->
      <div class="xl:col-span-2 bg-white p-8 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-800 mb-6">Recent Records</h2>
        <div class="overflow-hidden rounded-lg border border-slate-200">
          <table class="w-full text-left">
            <thead class="bg-slate-100 border-b border-slate-200">
              <tr>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">ID</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Scope</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Status</th>
                <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Date</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
              <tr *ngFor="let audit of audits" class="hover:bg-slate-50 transition">
                <td class="px-6 py-4 text-sm font-bold text-slate-900">#{{audit.auditId}}</td>
                <td class="px-6 py-4 text-sm text-slate-600">{{audit.scope}}</td>
                <td class="px-6 py-4">
                  <span [ngClass]="{
                    'bg-emerald-100 text-emerald-700 border-emerald-200': audit.status === 'CLOSED',
                    'bg-amber-100 text-amber-700 border-amber-200': audit.status === 'OPEN' || audit.status === 'IN_PROGRESS',
                    'bg-indigo-100 text-indigo-700 border-indigo-200': audit.status === 'REVIEW'
                  }" class="px-3 py-1 rounded-full text-xs font-bold border">
                    {{audit.status}}
                  </span>
                </td>
                <td class="px-6 py-4 text-sm text-slate-600">{{audit.date}}</td>
              </tr>
              <tr *ngIf="audits.length === 0">
                <td colspan="4" class="px-6 py-10 text-center text-slate-400 italic">No audit records found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
